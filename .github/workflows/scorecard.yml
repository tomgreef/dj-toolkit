# Rates the repository's supply-chain habits with OpenSSF Scorecard and publishes the score for the README badge.
# Don't add jobs, top-level env or defaults, or other actions: Scorecard refuses to publish from a workflow that has
# them (the action's README, "Workflow Restrictions"). Third-party action: why it is here is in docs/maintaining.md.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2" # every Tuesday, after Monday's dependency updates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'tomgreef/dj-toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # show the findings under Security > Code scanning
      id-token: write # lets Scorecard check that the results come from this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
