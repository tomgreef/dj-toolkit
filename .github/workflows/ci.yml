# The job names below are required checks on main (ruleset "Checks must pass", docs/maintaining.md).
# Rename one and every pull request waits for the old name: update the ruleset in the same change.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App on ${{ matrix.os }} (lint, format, tests)
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is not a required check yet (docs/maintaining.md): a failure there blocks nothing.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install the libraries Qt needs without a screen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libpulse0
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - name: Check (the same command contributors run)
        run: python tools/check.py

  website:
    name: Website (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refuse new dependencies with known vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
