# Prepares Copilot's workspace before it starts a task (such as a monthly major update), so it can run the same
# check as everyone else: python tools/check.py, and the website build. The job name is fixed by GitHub.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt # fails unless every package has a hash and its file matches
      - name: Install the libraries Qt needs without a screen (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libpulse0
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts # the build needs no install scripts, and a package could hide code in one
        working-directory: website
