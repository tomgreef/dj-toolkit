# Publishes website/ to GitHub Pages. One-time setup: Settings > Pages > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "assets/tutorials/**", ".github/workflows/pages.yml"]
  release:
    types: [published] # a release published by hand; the release workflow starts this build itself
  schedule:
    - cron: "17 5 * * *" # once a day, so the vote counts on the page stay fresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # a cache restored into the build that publishes the site could be poisoned
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --ignore-scripts # the build needs no install scripts, and a package could hide code in one
      - run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ github.token }} # reads public ideas and releases without hitting the anonymous rate limit
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publishes the built site
      id-token: write # proves to Pages that the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
